name: Regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install numpy av==18.1.0
      - name: Core, local HTTP and study helper regressions
        run: python -m unittest -v test_subtitle_translator test_subtitle_http test_study_pack
      - name: Command line entry
        run: python subtitle_translator.py --version
